apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
spec:
  replicas: 1

  selector:
    matchLabels:
      app: department-service

  template:
    metadata:
      labels:
        app: department-service

    spec:
      containers:
        - name: department-service
          image: department-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8082

          envFrom:
            - secretRef:
                name: department-service-secret